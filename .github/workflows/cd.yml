# Entrega/despliegue continuo con Docker.
# Se ejecuta solo cuando el workflow de CI termina bien en la rama main (o al crear un tag v*).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write        # para publicar en GitHub Container Registry (ghcr.io)

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/color-mixer

jobs:
  docker:
    name: Construir, probar y publicar imagen
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Calcular etiqueta
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # 1) Construir la imagen localmente (sin publicar todavía)
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: color-mixer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Prueba de humo: arrancar el contenedor y llamar a la API
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name app -p 8080:8080 color-mixer:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          # Misma colección de Postman que en CI, ahora contra el contenedor
          npx --yes newman@6 run postman/color-mixer.postman_collection.json \
            -e postman/local.postman_environment.json
          docker rm -f app

      # 3) Escaneo de vulnerabilidades de la imagen
      - name: Escanear imagen (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          image-ref: color-mixer:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # 4) Publicar en los registros
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login en Docker Hub (opcional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/color-mixer,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}

      - name: Publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Desplegar en producción
    needs: docker
    runs-on: ubuntu-latest
    # El entorno "produccion" se puede proteger con aprobación manual en Settings > Environments
    environment: produccion
    steps:
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Simulación de despliegue: descarga la imagen publicada, la arranca y verifica que responde.
      # En un caso real aquí iría el despliegue a un servidor, Kubernetes, Render, Azure, etc.
      - name: Desplegar y verificar
        run: |
          docker pull ${{ env.IMAGE }}:${{ needs.docker.outputs.tag }}
          docker run -d --name prod -p 8080:8080 ${{ env.IMAGE }}:${{ needs.docker.outputs.tag }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -sf "http://localhost:8080/api/colores/mezclar?colores=rojo,amarillo" | grep -q naranja
          echo "### Desplegada la imagen ${{ env.IMAGE }}:${{ needs.docker.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"