# Integración continua: se ejecuta en cada push y en cada Pull Request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: el token de GitHub solo puede leer el repo
permissions:
  contents: read

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarias (surefire) + integración (failsafe) + cobertura mínima (JaCoCo)
      - name: Pruebas unitarias, de integración y cobertura
        run: mvn -B verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "### Cobertura de líneas: %.1f%%\n", 100*c/(m+c)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: color-mixer-jar
          path: target/color-mixer.jar

  api-tests:
    name: Pruebas de API (Postman/Newman)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar el JAR compilado
        uses: actions/download-artifact@v4
        with:
          name: color-mixer-jar

      - name: Arrancar la aplicación
        run: |
          nohup java -jar color-mixer.jar > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat app.log
          exit 1

      - name: Ejecutar la colección de Postman con Newman
        run: |
          npx --yes newman@6 run postman/color-mixer.postman_collection.json \
            -e postman/local.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman/resultados.xml

      - name: Guardar resultados de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-postman
          path: |
            newman/
            app.log

  mutation-test:
    name: Pruebas de mutación (PIT)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ejecutar PIT
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Guardar informe de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mutacion
          path: target/pit-reports/

  dependency-scan:
    name: Análisis de dependencias y secretos (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v0.35.0 es la única versión no afectada por el ataque de cadena de suministro de marzo de 2026.
      # Buena práctica: fijar la acción por SHA de commit en lugar de por etiqueta.
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'